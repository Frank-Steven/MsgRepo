name: msgrepo_mobile
description: >-
  MsgRepo 手机端：采集 Android 通知与手动消息，本地 SQLite 存日程/待办/笔记；
  AI 处理优先走电脑端（adb 通道），电脑端不在线时走远程 OpenAI 兼容接口。
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.3.3
  crypto: ^3.0.3
  characters: ^1.3.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.2
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
